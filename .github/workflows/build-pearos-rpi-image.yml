name: Build PearOS-like Raspberry Pi Image

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache theme source downloads
        uses: actions/cache@v4
        with:
          path: .cache/theme-sources
          key: ${{ runner.os }}-theme-sources-${{ hashFiles('scripts/retrieve_sources.sh') }}

      - name: Enable binfmt on runner for ARM emulation
        run: |
          set -euo pipefail
          docker run --rm --privileged tonistiigi/binfmt --install arm64

      - name: Build ARM64 image in privileged container
        run: |
          set -euo pipefail
          # pi-gen needs root + privileged kernel features (chroot, mounts, loop devices).
          # Run the build in a privileged Docker container instead of directly on the host runner.
          docker run --rm --privileged \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            debian:bookworm bash -euxo pipefail -c "
              apt-get update
              apt-get install -y \
                coreutils quilt parted qemu-user-binfmt binfmt-support debootstrap zerofree zip \
                dosfstools libarchive-tools libcap2-bin rsync xz-utils file git curl sudo \
                bc bison flex libssl-dev make kmod cpio xxd pigz

              update-binfmts --enable qemu-aarch64 || true

              # pi-gen checks for these tools explicitly; fail early with a clear message.
              command -v qemu-aarch64-static >/dev/null || command -v qemu-aarch64 >/dev/null
              command -v xxd >/dev/null
              command -v pigz >/dev/null

              chmod +x scripts/*.sh
              ./scripts/build-image.sh

              # Fail fast with explicit diagnostics if pi-gen output was not produced.
              if [ ! -d .work/pi-gen/deploy ]; then
                echo '[ERROR] pi-gen deploy directory missing at /work/.work/pi-gen/deploy'
                if [ -f .work/pi-gen/build.log ]; then
                  echo '[INFO] Last 200 lines from pi-gen build.log:'
                  tail -n 200 .work/pi-gen/build.log
                fi
                exit 1
              fi
            "

      - name: Debug pi-gen output paths
        if: always()
        run: |
          ROOT_DIR="${GITHUB_WORKSPACE}"
          PI_GEN_DIR="${ROOT_DIR}/.work/pi-gen"

          echo "[DEBUG] Current working directory:"
          pwd
          echo "[DEBUG] Repository root contents:"
          ls -lah "${ROOT_DIR}"
          echo "[DEBUG] pi-gen directory contents (if present):"
          ls -lah "${PI_GEN_DIR}" || true

          if [ -f "${PI_GEN_DIR}/build.log" ]; then
            echo "[DEBUG] Last 200 lines of pi-gen build.log:"
            tail -n 200 "${PI_GEN_DIR}/build.log"
          else
            echo "[DEBUG] pi-gen build.log not found at ${PI_GEN_DIR}/build.log"
          fi

      - name: Generate checksums
        if: success()
        run: |
          set -euo pipefail
          ROOT_DIR="${GITHUB_WORKSPACE}"

          echo "[DEBUG] Current working directory:"
          pwd
          echo "[DEBUG] Files in repository root:"
          ls -lah "${ROOT_DIR}"

          # out/ is created only after a successful pi-gen build and copy step.
          # If it is missing, fail with a clear error instead of crashing on cd.
          if [ -d "${ROOT_DIR}/out" ]; then
            cd "${ROOT_DIR}/out"
          else
            echo "[ERROR] Output directory not found. Build likely failed."
            PI_GEN_DIR="${ROOT_DIR}/.work/pi-gen"
            if [ -f "${PI_GEN_DIR}/build.log" ]; then
              echo "[INFO] Last 200 lines from pi-gen build.log:"
              tail -n 200 "${PI_GEN_DIR}/build.log"
            fi
            exit 1
          fi

          sha256sum * > SHA256SUMS

      - name: Upload image artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pearos-like-rpi-image
          path: |
            out/*
          if-no-files-found: error
          retention-days: 14
